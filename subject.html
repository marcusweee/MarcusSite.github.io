<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semester — Subject</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="mark">semester<span>.</span></a>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="subjects.html" class="active">Subjects</a>
    <a href="recordings.html">Recordings</a>
    <a href="general.html">General</a>
  </div>
</nav>

<div class="wrap" id="app">
  <!-- filled by script -->
</div>

<script src="config.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const slug = params.get("c");
  const subject = slug ? getSubjectBySlug(slug) : null;
  const app = document.getElementById("app");

  function looksLikePdf(item) {
    const url = item.url || "";
    const label = item.label || "";
    return /\.pdf($|\?)/i.test(url) || /\.pdf$/i.test(label.trim());
  }

  function canEmbed(url) {
    try {
      const host = new URL(url, window.location.href).hostname;
      // SharePoint/OneDrive block iframe embedding outside their own org
      // domain and require a Microsoft login, so don't try to embed these —
      // just link out normally instead.
      return !/(^|\.)sharepoint\.com$|(^|\.)onedrive\.live\.com$/i.test(host);
    } catch (e) {
      return false;
    }
  }

  function buildPdfItem(item) {
    const li = document.createElement("li");
    li.className = "pdf-item";

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "pdf-toggle";
    btn.setAttribute("aria-expanded", "false");
    btn.innerHTML = "<span>" + item.label + "</span><span class=\"chevron\">▸</span>";

    const frame = document.createElement("div");
    frame.className = "pdf-frame";
    frame.hidden = true;

    let loaded = false;
    btn.addEventListener("click", () => {
      const expanded = btn.getAttribute("aria-expanded") === "true";
      btn.setAttribute("aria-expanded", String(!expanded));
      frame.hidden = expanded;
      if (!loaded && !expanded) {
        const iframe = document.createElement("iframe");
        iframe.src = item.url;
        iframe.title = item.label;
        const openNew = document.createElement("a");
        openNew.className = "pdf-open-new";
        openNew.href = item.url;
        openNew.target = "_blank";
        openNew.rel = "noopener";
        openNew.textContent = "Open in new tab ↗";
        frame.appendChild(iframe);
        frame.appendChild(openNew);
        loaded = true;
      }
    });

    li.appendChild(btn);
    li.appendChild(frame);
    return li;
  }

  function buildList(items, emptyHint) {
    if (!items || items.length === 0) {
      const div = document.createElement("div");
      div.className = "empty-slot";
      div.innerHTML = emptyHint;
      return div;
    }
    const ul = document.createElement("ul");
    ul.className = "item-list";
    items.forEach((item) => {
      if (looksLikePdf(item) && canEmbed(item.url)) {
        ul.appendChild(buildPdfItem(item));
        return;
      }
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = item.url || "#";
      a.target = "_blank";
      a.rel = "noopener";
      a.textContent = item.label;
      li.appendChild(a);
      ul.appendChild(li);
    });
    return ul;
  }

  if (!subject) {
    app.innerHTML =
      '<div class="page-head"><h1>Subject not found</h1>' +
      '<p>That link doesn\'t match anything in config.js.</p></div>' +
      '<a class="breadcrumb" href="subjects.html">← Back to subjects</a>';
  } else {
    document.title = subject.code + " — " + subject.name;

    const back = document.createElement("a");
    back.className = "breadcrumb";
    back.href = "subjects.html";
    back.textContent = "← Back to subjects";
    app.appendChild(back);

    const paper = document.createElement("div");
    paper.className = "paper";

    const code = document.createElement("div");
    code.className = "code";
    code.textContent = subject.code;

    const h1 = document.createElement("h1");
    h1.textContent = subject.name;

    const dgrid = document.createElement("div");
    dgrid.className = "detail-grid";

    const linksSection = document.createElement("div");
    linksSection.className = "detail-section";
    linksSection.innerHTML = "<h3>Class links</h3>";
    linksSection.appendChild(
      buildList(subject.links, 'No links yet — add to this subject\'s <code>links</code> array in config.js.')
    );

    const materialsSection = document.createElement("div");
    materialsSection.className = "detail-section";
    materialsSection.innerHTML = "<h3>Materials</h3>";
    materialsSection.appendChild(
      buildList(subject.materials, 'No materials yet — add to this subject\'s <code>materials</code> array in config.js.')
    );

    const recordingsSection = document.createElement("div");
    recordingsSection.className = "detail-section";
    recordingsSection.innerHTML = "<h3>Recordings</h3>";
    recordingsSection.appendChild(
      buildList(subject.recordings, 'No recordings yet — add to this subject\'s <code>recordings</code> array in config.js.')
    );

    dgrid.appendChild(linksSection);
    dgrid.appendChild(materialsSection);
    dgrid.appendChild(recordingsSection);

    paper.appendChild(code);
    paper.appendChild(h1);
    paper.appendChild(dgrid);
    app.appendChild(paper);
  }
</script>

</body>
</html>
