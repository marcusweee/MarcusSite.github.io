<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semester — General</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="mark">semester<span>.</span></a>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="subjects.html">Subjects</a>
    <a href="recordings.html">Recordings</a>
    <a href="general.html" class="active">General</a>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <h1>General</h1>
    <p>Notes and links that aren't tied to one subject — portal, enrollment, org pages.</p>
  </div>

  <div id="notebook-empty" class="setup-note" style="display:none;">
    Nothing here yet. Add lines to <code>GENERAL_ITEMS</code> in config.js — give an
    entry a <code>url</code> to make it a link, or leave it blank for a plain note.
  </div>

  <div class="notebook" id="notebook"></div>
</div>

<script src="config.js"></script>
<script>
  const notebook = document.getElementById("notebook");

  if (!GENERAL_ITEMS || GENERAL_ITEMS.length === 0) {
    document.getElementById("notebook-empty").style.display = "block";
  } else {
    let contentIndex = 0;
    GENERAL_ITEMS.forEach((item) => {
      if (item.heading) {
        const heading = document.createElement("div");
        heading.className = "notebook-heading";
        heading.textContent = item.heading;
        notebook.appendChild(heading);
        return;
      }

      const row = document.createElement("div");
      row.className = "notebook-row" + (contentIndex % 2 === 1 ? " blue" : "");
      contentIndex++;

      const body = document.createElement("div");
      body.className = "body";

      if (item.url) {
        const a = document.createElement("a");
        a.className = "notebook-link";
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = item.text;
        body.appendChild(a);

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "↗";
        body.appendChild(arrow);
      } else if (item.text) {
        body.classList.add("plain");
        body.appendChild(document.createTextNode(item.text));
      } else {
        body.classList.add("plain");
      }

      if (item.bullets && item.bullets.length > 0) {
        const ul = document.createElement("ul");
        ul.className = "sub-bullets";
        item.bullets.forEach((b) => {
          const li = document.createElement("li");
          li.textContent = b;
          ul.appendChild(li);
        });
        body.appendChild(ul);
      }

      row.appendChild(body);
      notebook.appendChild(row);
    });
  }
</script>

</body>
</html>
