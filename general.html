<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="mark">QuickLinks<span><3</span></a>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="subjects.html">Subjects</a>
    <a href="general.html" class="active">General</a>
    <div class="music-player" aria-label="Music player">
      <button class="music-control" type="button" data-music-previous aria-label="Previous song" title="Previous song">&#9198;</button>
      <button class="music-control" type="button" data-music-play aria-label="Play or pause" title="Play or pause">&#9654;</button>
      <button class="music-control" type="button" data-music-next aria-label="Next song" title="Next song">&#9197;</button>
      <span class="music-track">No music added</span>
      <input class="music-seek" type="range" min="0" max="0" value="0" step="0.1" data-music-seek aria-label="Song progress" />
      <button class="volume-button" type="button" data-music-volume aria-label="Volume" aria-expanded="false" title="Volume"><span class="volume-icon" aria-hidden="true">&#9835;</span></button>
      <div class="volume-panel">
        <input class="volume-slider" type="range" min="0" max="1" value="0.05" step="0.01" data-music-volume-slider aria-label="Volume" />
      </div>
      <button class="music-menu-button" type="button" data-music-menu aria-label="Choose song" aria-expanded="false" title="Choose song"><span class="menu-icon" aria-hidden="true"></span></button>

    </div>
    <button class="animation-toggle" type="button" aria-pressed="false">Pause petals</button>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <h1>General</h1>
    <p>life is short...... kaya tara inuman na</p>
  </div>

  <div id="notebook-empty" class="setup-note" style="display:none;">
    Nothing here yet. Add lines to <code>GENERAL_ITEMS</code> in config.js — give an
    entry a <code>url</code> to make it a link, or leave it blank for a plain note.
  </div>

  <div class="notebook" id="notebook"></div>
</div>

<script src="config.js"></script>
<script src="petals.js"></script>
<script src="music.js"></script>
<script>
  const notebook = document.getElementById("notebook");

  if (!GENERAL_ITEMS || GENERAL_ITEMS.length === 0) {
    document.getElementById("notebook-empty").style.display = "block";
  } else {
    let contentIndex = 0;
    GENERAL_ITEMS.forEach((item) => {
      if (item.heading) {
        const heading = document.createElement("div");
        heading.className = "notebook-heading";
        heading.textContent = item.heading;
        notebook.appendChild(heading);
        return;
      }

      const row = document.createElement("div");
      row.className = "notebook-row" + (contentIndex % 2 === 1 ? " blue" : "");
      contentIndex++;

      const body = document.createElement("div");
      body.className = "body";

      if (item.url) {
        const a = document.createElement("a");
        a.className = "notebook-link";
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = item.text;
        body.appendChild(a);

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "↗";
        body.appendChild(arrow);
      } else if (item.text) {
        body.classList.add("plain");
        body.appendChild(document.createTextNode(item.text));
      } else {
        body.classList.add("plain");
      }

      if (item.bullets && item.bullets.length > 0) {
        const ul = document.createElement("ul");
        ul.className = "sub-bullets";
        item.bullets.forEach((b) => {
          const li = document.createElement("li");
          li.textContent = b;
          ul.appendChild(li);
        });
        body.appendChild(ul);
      }

      row.appendChild(body);
      notebook.appendChild(row);
    });
  }
</script>

</body>
</html>
