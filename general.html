<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Semester — General</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<nav class="site-nav">
  <a href="index.html" class="mark">General<span><3</span></a>
  <div class="links">
    <a href="index.html">Home</a>
    <a href="subjects.html">Subjects</a>
    <a href="general.html" class="active">General</a>
  </div>
</nav>

<div class="wrap">
  <div class="page-head">
    <h1>Quick links</h1>
    <p>Type shitttt.</p>
  </div>

  <div id="notebook-empty" class="setup-note" style="display:none;">
    Nothing here yet. Add lines to <code>GENERAL_ITEMS</code> in config.js — give an
    entry a <code>url</code> to make it a link, or leave it blank for a plain note.
  </div>

  <div class="notebook" id="notebook"></div>
</div>

<script src="config.js"></script>
<script>
  const notebook = document.getElementById("notebook");

  if (!GENERAL_ITEMS || GENERAL_ITEMS.length === 0) {
    document.getElementById("notebook-empty").style.display = "block";
  } else {
    GENERAL_ITEMS.forEach((item) => {
      const row = document.createElement("div");
      row.className = "notebook-row";

      const dot = document.createElement("span");
      dot.className = "dot";
      row.appendChild(dot);

      const body = document.createElement("div");

      if (item.url) {
        body.className = "body";
        const a = document.createElement("a");
        a.className = "notebook-link";
        a.href = item.url;
        a.target = "_blank";
        a.rel = "noopener";
        a.textContent = item.text;
        body.appendChild(a);
      } else {
        body.className = "body plain";
        body.textContent = item.text;
      }

      row.appendChild(body);

      if (item.url) {
        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "↗";
        row.appendChild(arrow);
      }

      notebook.appendChild(row);
    });
  }
</script>

</body>
</html>
